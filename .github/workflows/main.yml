name: Python CI/CD

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run Guessing Game test
        run: |
          python Guessing.py < input.txt

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user
            if [ -d "GuessingGame" ]; then
              cd GuessingGame
              git pull
            else
              git clone https://github.com/Ngomeli/GuessingGame.git
              cd GuessingGame
            fi
            python3 Guessing.py < input.txt
